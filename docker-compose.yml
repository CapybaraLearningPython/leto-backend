services:
  mysql:
    image: mysql:8.0
    container_name: leto-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Leto2026Deploy#
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    mem_limit: 512m           # 限制内存占用，避免吃满
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7-alpine
    container_name: leto-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    mem_limit: 128m

  consul:
    image: hashicorp/consul:1.19
    container_name: leto-consul
    restart: unless-stopped
    network_mode: host
    command: agent -dev -client=0.0.0.0
    mem_limit: 128m

  kafka:
    image: apache/kafka:3.8.0     # 官方镜像，内置KRaft模式，不需要Zookeeper
    container_name: leto-kafka
    restart: unless-stopped
    network_mode: host
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"   # 限制JVM堆，省内存
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    mem_limit: 768m

volumes:
  mysql_data:
